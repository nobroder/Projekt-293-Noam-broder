                </div>
                <div class="contact_row_center">
                    <textarea class="contact_input contact_textarea" name="text" placeholder="Text" required></textarea>
                </div>
                <div class="contact_row_center">
                    <button class="contact_input contact_btn" type="submit">Absenden</button>
                </div>
